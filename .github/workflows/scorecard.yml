name: OpenSSF Scorecard

# Scores the repository's security practices and publishes the result
# to the public Scorecard API (used by the README badge).
on:
  branch_protection_rule:
  schedule:
    - cron: "0 4 * * 3"
  push:
    branches: [main]

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
